<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario de Registro</title>
<link rel="stylesheet" href="../styles/formulario1.css">
</head>
<body>
<main>
<h1>Formulario de registro</h1>
<form action="#" method="post">
<div class="form-field">
<label for="nombre">Nombre</label>
<input type="text" id="nombre" name="nombre" placeholder="Tu nombre" autocomplete="name" required>
</div>
<div class="form-field">
<label for="email">Correo electrónico</label>
<input type="email" id="email" name="email" placeholder="nombre@correo.com" autocomplete="email" required>
</div>
<div class="form-field">
<label for="password">Contraseña</label>
<input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required>
<small class="field-help">Debe contener al menos 8 caracteres.</small>
</div>
<label class="choice">
<input type="checkbox" name="terminos" required>
Acepto los términos y condiciones
</label>
<div class="form-actions">
<button type="submit">Registrarme</button>
<button type="reset">Limpiar</button>
</div>
</form>
</main>
</body>
</html>
