<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encuesta</title>
<link rel="stylesheet" href="../styles/formulario2.css">
</head>
<body>
<main>
<h1>Encuesta de satisfacción</h1>
<form action="#" method="post">
<fieldset>
<legend>¿Cómo calificaría el servicio?</legend>
<label class="choice">
<input type="radio" name="calificacion" value="excelente" checked>
Excelente
</label>
<label class="choice">
<input type="radio" name="calificacion" value="bueno">
Bueno
</label>
<label class="choice">
<input type="radio" name="calificacion" value="regular">
Regular
</label>
</fieldset>
<fieldset>
<legend>¿Qué aspectos le interesan?</legend>
<label class="choice">
<input type="checkbox" name="aspectos" value="atencion">
Atención al cliente
</label>
<label class="choice">
<input type="checkbox" name="aspectos" value="precio">
Precio
</label>
<label class="choice">
<input type="checkbox" name="aspectos" value="rapidez">
Rapidez
</label>
</fieldset>
<div class="form-field">
<label for="satisfaccion">Nivel de satisfacción</label>
<input type="range" id="satisfaccion" name="satisfaccion" min="1" max="5" value="3">
</div>
<div class="form-actions">
<button type="submit">Enviar</button>
<button type="reset">Limpiar</button>
</div>
</form>
</main>
</body>
</html>
