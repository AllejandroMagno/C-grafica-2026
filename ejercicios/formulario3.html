<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitud laboral</title>
<link rel="stylesheet" href="../styles/formulario3.css">
</head>
<body>
<main>
<h1>Solicitud de empleo</h1>
<form action="#" method="post">
<div class="form-field">
<label for="nombre">Nombre completo</label>
<input type="text" id="nombre" name="nombre" autocomplete="name" required>
</div>
<div class="form-field">
<label for="email">Correo electrónico</label>
<input type="email" id="email" name="email" autocomplete="email" required>
</div>
<div class="form-field">
<label for="puesto">Puesto al que aplica</label>
<input type="text" id="puesto" name="puesto" placeholder="Ej. Desarrollador Backend" required>
</div>
<div class="form-field">
<label for="cv">Hoja de vida</label>
<input type="file" id="cv" name="cv" accept=".pdf,.doc,.docx" required>
<small class="field-help">Formatos aceptados: PDF, Word.</small>
</div>
<div class="form-actions">
<button type="submit">Enviar solicitud</button>
<button type="reset">Limpiar</button>
</div>
</form>
</main>
</body>
</html>
