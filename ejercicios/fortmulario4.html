<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soporte</title>
<link rel="stylesheet" href="../styles/formulario4.css">
</head>
<body>
<main>
<h1>Formulario de soporte</h1>
<form action="#" method="post">
<div class="form-field">
<label for="prioridad">Prioridad</label>
<select id="prioridad" name="prioridad" required>
<option value="" selected disabled>Seleccione una prioridad</option>
<option value="baja">Baja</option>
<option value="media">Media</option>
<option value="alta">Alta</option>
</select>
</div>
<div class="form-field">
<label for="mensaje">Describa el problema</label>
<textarea id="mensaje" name="mensaje" rows="6" maxlength="1000" placeholder="Describa brevemente el problema..." required></textarea>
</div>
<div class="form-field">
<label for="archivo">Archivo adjunto</label>
<input type="file" id="archivo" name="archivo" accept=".pdf,.png,.jpg,.jpeg">
</div>
<div class="form-actions">
<button type="submit">Enviar ticket</button>
<button type="reset">Limpiar</button>
</div>
</form>
</main>
</body>
</html>
